<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸運輪盤｜照片尋寶</title>
<link rel="preload" href="assets/huninn-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/tools.css"><style>@font-face{font-family:'Huninn';src:url('assets/huninn-subset.woff2') format('woff2');font-display:block}
:root{--cream:#FFF8EC;--sky:#BFE3F5;--mint:#C8EBD9;--butter:#FFE9A8;--blush:#F9D0D6;--ink:#4A3F35;--ink2:#7a6e63}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#efe6d6;overflow:hidden}
body{font-family:'Huninn','jf open 粉圓','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;padding:80px 110px;display:none;flex-direction:column;align-items:center;background-color:var(--cream);overflow:hidden}
.slide.on{display:flex;animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.slide::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide>*{position:relative;z-index:1}
.bg1{background:radial-gradient(closest-side,#BFE3F5cc,#BFE3F500) -120px -160px/900px 800px no-repeat,radial-gradient(closest-side,#F9D0D6cc,#F9D0D600) 1350px 620px/800px 700px no-repeat,radial-gradient(closest-side,#FFE9A8bb,#FFE9A800) 1250px -200px/700px 600px no-repeat,radial-gradient(closest-side,#C8EBD9bb,#C8EBD900) -100px 700px/700px 600px no-repeat,#FFF8EC}
.bg2{background:radial-gradient(closest-side,#C8EBD9cc,#C8EBD900) 1300px -180px/900px 800px no-repeat,radial-gradient(closest-side,#FFE9A8cc,#FFE9A800) -180px 600px/850px 700px no-repeat,radial-gradient(closest-side,#F9D0D6aa,#F9D0D600) 1450px 720px/600px 500px no-repeat,#FFF8EC}
.bg3{background:radial-gradient(closest-side,#F9D0D6cc,#F9D0D600) -150px -150px/850px 750px no-repeat,radial-gradient(closest-side,#BFE3F5cc,#BFE3F500) 1300px 600px/900px 750px no-repeat,radial-gradient(closest-side,#FFE9A8aa,#FFE9A800) 700px 800px/700px 500px no-repeat,#FFF8EC}
.bg4{background:radial-gradient(closest-side,#FFE9A8cc,#FFE9A800) -150px -180px/850px 750px no-repeat,radial-gradient(closest-side,#C8EBD9cc,#C8EBD900) 1350px 650px/800px 700px no-repeat,radial-gradient(closest-side,#BFE3F5aa,#BFE3F500) 1400px -200px/600px 600px no-repeat,#FFF8EC}
h1{font-size:170px;line-height:1.12;text-align:center;font-weight:normal;letter-spacing:8px;color:#3d6f9c;text-shadow:6px 6px 0 #fff}
h2{font-size:84px;font-weight:normal;margin-bottom:50px;letter-spacing:4px;padding:0 40px;background:linear-gradient(transparent 62%,#FFE9A8 62%,#FFE9A8 92%,transparent 92%)}
.title{justify-content:center}.kicker{font-size:44px;color:var(--ink2);background:#fff9;border-radius:40px;padding:10px 40px;margin-bottom:30px}
.steps3,.end3{display:flex;gap:36px;align-items:center;margin-top:60px;font-size:52px}.steps3>span:not(.arr),.end3>span{display:flex;align-items:center;gap:18px;background:#fffc;border-radius:60px;padding:14px 38px 14px 18px;box-shadow:0 6px 0 #0000000d}
.arr{color:#c9b9a5}.end{font-size:190px;color:#e07a8b}.big{font-size:60px;margin-top:20px}.end3{font-size:44px;gap:30px}
.cards3{display:flex;gap:56px;flex:1;align-items:center}.card{width:500px;height:560px;border-radius:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;box-shadow:0 12px 0 #0000000f;border:5px solid #fff}
.card b{font-size:72px;font-weight:normal}.card p{font-size:46px;text-align:center;line-height:1.45;color:#5c5147}
.c-sky{background:#BFE3F5}.c-butter{background:#FFE9A8}.c-blush{background:#F9D0D6}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:36px 56px;width:100%}.rule{display:flex;align-items:center;gap:34px;background:#fffd;border-radius:48px;padding:28px 40px;box-shadow:0 8px 0 #0000000d}
.ri{width:150px;height:150px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}.rule:nth-child(2) .ri{background:var(--sky)}.rule:nth-child(3) .ri{background:var(--blush)}.rule:nth-child(4) .ri{background:var(--butter)}
.rule b{font-size:62px;font-weight:normal}.rule p{font-size:40px;color:var(--ink2);margin-top:6px}
.banner{margin-top:44px;font-size:52px;background:#F9D0D6;border-radius:50px;padding:18px 56px}.banner b{color:#c0394f;font-weight:normal}
.cabs4{display:flex;gap:44px;flex:1;align-items:center}.cabc{width:370px;height:470px;background:#fffd;border-radius:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;box-shadow:0 10px 0 #0000000d}
.cabc b{font-size:62px;font-weight:normal}.cabc:nth-child(1){border-bottom:14px solid var(--sky)}.cabc:nth-child(2){border-bottom:14px solid var(--butter)}.cabc:nth-child(3){border-bottom:14px solid var(--mint)}.cabc:nth-child(4){border-bottom:14px solid var(--blush)}
.foot{font-size:48px;margin-top:20px}.foot b{font-weight:normal;color:#3d6f9c}
.groups{display:flex;gap:56px;flex:1;align-items:center}.grp{width:500px;height:600px;border-radius:60px;border:8px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.grp b{font-size:86px;font-weight:normal}.grp span{font-size:54px}.grp p{font-size:42px;text-align:center;line-height:1.5;margin-top:16px}.grp em{font-style:normal;color:#fff;border-radius:16px;padding:0 14px}.grp strong{font-weight:normal;font-size:52px}
.w5{display:flex;gap:30px;flex:1;align-items:center}.w{width:322px;height:620px;border-radius:56px;background:#fffd;border-top:22px solid var(--c);display:flex;flex-direction:column;align-items:center;padding-top:34px;box-shadow:0 10px 0 #0000000d}
.wi{width:150px;height:150px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}.w b{font-size:120px;font-weight:normal;line-height:1.25}
.wq{font-size:44px;text-align:center}.wf{font-size:34px;color:var(--ink2);margin-top:22px;background:#f6efe3;border-radius:20px;padding:6px 16px}
.toolslide{padding:70px 100px}
.reveal{flex-direction:row;align-items:center;gap:64px;padding:70px 90px}
.ph{background:#fff;padding:22px 22px 60px;border-radius:14px;box-shadow:0 18px 40px #6b553a33;transform:rotate(-1.6deg);flex:none}
.ph img{display:block;width:1040px;height:780px;object-fit:cover;border-radius:6px}.ph.wide img{width:1010px;height:568px}
.tape{position:absolute;top:-26px;left:50%;width:220px;height:52px;margin-left:-110px;background:#FFE9A8cc;transform:rotate(3deg);border-radius:4px}
.side{flex:1;display:flex;flex-direction:column;align-items:flex-start}.gt{color:#fff;font-size:40px;border-radius:40px;padding:6px 30px;border:5px solid #fff}
h3{font-size:84px;font-weight:normal;margin-top:16px;line-height:1.2}.codes{font-size:38px;color:var(--ink2);margin-bottom:18px}
.pr{list-style:none;display:flex;flex-direction:column;gap:20px;width:100%}.pr li{display:flex;align-items:center;gap:20px;background:#fffd;border-radius:40px;padding:8px 22px 8px 10px;border-left:16px solid var(--c)}
.pi{width:84px;height:84px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}.pk{font-size:64px}.pq{font-size:46px;white-space:nowrap}
#nav{position:fixed;right:18px;bottom:14px;display:flex;gap:10px;align-items:center;z-index:9;font-family:inherit}
#nav button{width:58px;height:58px;border-radius:50%;border:none;background:#ffffffcc;color:#4A3F35;font-size:28px;cursor:pointer;box-shadow:0 2px 6px #0002}#count{background:#ffffffcc;border-radius:20px;padding:6px 14px;font-size:20px}
#bar{position:fixed;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#8CC8EA,#8FD3B0,#F7C873,#F4A6B5);transition:width .3s;z-index:9}
body.shot #nav,body.shot #bar{display:none}
.slide.on{animation:none}</style></head><body>
<div id="stage"><section class="slide bg4 toolslide on"><div class="ph-wheel" style="width:100%;flex:1;display:flex"></div></section></div>
<script src="assets/tools.js"></script><script>
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);const st=document.getElementById('stage');st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='center center'}
addEventListener('resize',fit);fit();const wh=PhotoHunt.wheel(document.querySelector('.ph-wheel'));addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();wh.spin()}});
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
</script></body></html>
